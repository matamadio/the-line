name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      # The playable build of this commit, downloadable from the run's page.
      - uses: actions/upload-artifact@v4
        with:
          name: the-line-web
          path: dist
